<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Contact</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    body {
      background: #f5f7fb;
      min-height: 100vh;
      display: flex;
      align-items: center;
    }

    .contact-box {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    .contact-title {
      font-weight: 700;
      margin-bottom: 25px;
      text-align: center;
      color: #222;
    }

    .form-control {
      border-radius: 12px;
      padding: 12px;
      border: 1px solid #ddd;
    }

    .form-control:focus {
      box-shadow: none;
      border-color: #0d6efd;
    }

    .btn-contact {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      font-weight: 600;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="contact-box">

      <h2 class="contact-title">Contactez-nous</h2>

      <form>

        <div class="mb-3">
          <input
            type="text"
            class="form-control"
            placeholder="Votre nom"
          >
        </div>

        <div class="mb-3">
          <input
            type="email"
            class="form-control"
            placeholder="Votre email"
          >
        </div>

        <div class="mb-3">
          <textarea
            class="form-control"
            rows="5"
            placeholder="Votre message"
          ></textarea>
        </div>

        <button class="btn btn-primary btn-contact">
          Envoyer le message
        </button>

      </form>

    </div>
  </div>

</body>
</html>

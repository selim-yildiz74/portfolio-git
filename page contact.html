<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Contact</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
</head>

<body>

  <div class="container mt-5">

    <h2 class="mb-4">Contact</h2>

    <form>

      <div class="mb-3">
        <input
          type="text"
          class="form-control"
          placeholder="Votre nom"
        >
      </div>

      <div class="mb-3">
        <input
          type="email"
          class="form-control"
          placeholder="Votre email"
        >
      </div>

      <div class="mb-3">
        <textarea
          class="form-control"
          rows="4"
          placeholder="Votre message"
        ></textarea>
      </div>

      <button class="btn btn-primary">
        Envoyer
      </button>

    </form>

  </div>

</body>
</html>
